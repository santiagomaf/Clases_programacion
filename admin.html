<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Ejercicios de Python</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <h1>🛠️ Panel de profesor</h1>
    <div class="nav-links">
      <a href="repaso.html">📚 Repaso</a>
      <a href="index.html" class="muted">Vista alumno</a>
      <button class="secondary" id="logoutBtn" style="margin-left:12px;padding:5px 12px">Salir</button>
    </div>
  </header>

  <div class="container">
    <!-- Login admin -->
    <div class="card" id="adminLogin">
      <h2>Acceso profesor</h2>
      <p class="muted">Introduce la contraseña de administrador.</p>
      <input type="password" id="pwInput" placeholder="Contraseña">
      <div class="btn-row"><button id="pwBtn">Entrar</button></div>
      <p class="muted" id="pwErr" style="color:var(--bad)"></p>
    </div>

    <!-- Contenido admin -->
    <div class="hidden" id="adminMain">
      <div class="btn-row" style="margin-bottom:16px">
        <button id="tabEx">📝 Ejercicios</button>
        <button id="tabSub" class="secondary">📥 Entregas</button>
      </div>

      <!-- ===== Pestaña: Ejercicios ===== -->
      <div id="paneEx">
        <div class="two-col">
          <!-- Editor -->
          <div class="card">
            <h2 id="editorTitle">Nuevo ejercicio</h2>
            <input type="hidden" id="exId">
            <label>Título</label>
            <input type="text" id="fTitle" placeholder="Ej: Clasificación de karting">

            <label>Enunciado (lo que ve el alumno)</label>
            <textarea id="fDesc" rows="6" placeholder="Describe el ejercicio, con ejemplos de entrada/salida…"></textarea>

            <label>Código inicial (opcional, aparece precargado)</label>
            <textarea class="code" id="fStarter" style="min-height:100px" placeholder="# Escribe tu solución aquí"></textarea>

            <label>Tipo de ejercicio</label>
            <select id="fType">
              <option value="io">Programa con entrada/salida (input/print)</option>
              <option value="code">Funciones (se revisan con asserts)</option>
            </select>

            <!-- Config IO -->
            <div id="ioConfig">
              <label>Modo de comparación de la salida</label>
              <select id="fMatch">
                <option value="contains">Tolerante — basta que aparezcan las líneas esperadas (recomendado)</option>
                <option value="exact">Estricto — la salida debe coincidir línea por línea</option>
              </select>
              <label>Casos de prueba</label>
              <div id="ioCases"></div>
              <button class="secondary" id="addCaseBtn" style="margin-top:6px">+ Añadir caso</button>
            </div>

            <!-- Config code -->
            <div id="codeConfig" class="hidden">
              <label>Código de comprobación (asserts). Se ejecuta tras el código del alumno.</label>
              <textarea class="code" id="fTestCode" style="min-height:140px" placeholder="assert suma(1, 3) == 4&#10;assert suma(-2, 2) == 0"></textarea>
            </div>

            <label>Solución de referencia (opcional, solo para ti)</label>
            <textarea class="code" id="fSolution" style="min-height:100px" placeholder="# Solución correcta para verificar los tests"></textarea>

            <div class="btn-row">
              <button id="saveExBtn">Guardar ejercicio</button>
              <button class="secondary" id="testSolBtn">🧪 Probar tests con la solución</button>
              <button class="secondary" id="newExBtn">Limpiar / Nuevo</button>
              <span class="status" id="editorStatus"></span>
            </div>
            <div class="results" id="editorResults"></div>
          </div>

          <!-- Lista de ejercicios existentes -->
          <div class="card">
            <h2>Ejercicios creados</h2>
            <ul class="exercise-list" id="adminExList"></ul>
          </div>
        </div>
      </div>

      <!-- ===== Pestaña: Entregas ===== -->
      <div id="paneSub" class="hidden">
        <div class="card">
          <h2>Entregas de los alumnos</h2>
          <label>Filtrar por ejercicio</label>
          <select id="subFilter"><option value="">Todos los ejercicios</option></select>
          <div id="subList" style="margin-top:14px"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/db.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
